name: build

on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+'] # e.g. 2.4.0, without a "v"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # only used to attach files to a release on tag pushes
    steps:
      - uses: actions/checkout@v4

      - name: Build Snap.exe
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File src\build.ps1

      - name: SHA-256 checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash dist\Snap.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Snap.exe" | Out-File -Encoding ascii dist\Snap.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Snap
          path: |
            dist/Snap.exe
            dist/Snap.exe.sha256

      - name: Attach to release
        if: github.ref_type == 'tag'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist\Snap.exe dist\Snap.exe.sha256 --clobber
          } else {
            gh release create $tag dist\Snap.exe dist\Snap.exe.sha256 --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
